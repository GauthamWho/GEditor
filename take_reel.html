<!-- GEditor TAKE page (take_api.py copies it into every take folder as reel.html). Same contract as every kit:

     ?caponly=1&ow=&oh= draws only the caption layer on a transparent page (the export's caption frames). -->

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&family=Inter+Tight:wght@800&family=DM+Serif+Display&family=Caveat:wght@700&family=Instrument+Serif:ital@1&family=Anton&family=Montserrat:wght@800;900&family=Poppins:wght@700;800&family=Bebas+Neue&display=block" rel="stylesheet">
<style>
html,body{margin:0;padding:0;overflow:hidden;background:transparent}
#stage{position:relative;overflow:hidden;background:#000}
body.cap #stage{background:transparent}
#v{position:absolute;left:0;top:0;transform-origin:0 0;object-fit:fill}

.grp i{font-style:normal;display:inline-block;position:relative;white-space:pre}
.grp i b{position:absolute;left:-2px;right:-2px;bottom:-6px;height:6px;border-radius:3px;transform-origin:0 50%}

#safe div{position:absolute}

</style></head><body>
<div id="stage"><div id="pic" style="position:absolute;inset:0;overflow:hidden"><video id="v" playsinline preload="auto"></video><canvas id="cv" style="position:absolute;left:0;top:0;transform-origin:0 0;display:none"></canvas></div><video id="mv" playsinline muted preload="auto" style="display:none"></video><div id="caps"></div><div id="safe"></div><div id="msg">Opening your take…</div></div>
<script>
(function () {
  const Q = new URLSearchParams(location.search), CAP = Q.get('caponly') === '1', FPS = 30;

  let TK = null, OW = 1080, OH = 1920, starts = [], groups = [], lastT = -1, lastWall = 0, lastBlock = -1, wantPlay = false;

  /* ---------- maths shared with take_api.py ---------- */
  function interp(t, T, Vv) {

    if (TK.settings.zooms === false && b.zoomBy !== 'hand') return 1;
    const z0 = +(b.zoom || 1), z1 = b.zoomTo == null ? z0 : +b.zoomTo; if (Math.abs(z1 - z0) < 1e-4) return z0;
    const L = Math.max(b.out - b.in, 1e-3), e = +(b.ease || 0); let p = clamp((t - b.in) / (e > 0 ? Math.min(e, L) : L), 0, 1);

  function win(b, srcT) {
    const W = TK.info.w, H = TK.info.h, st = TK.settings, E = TK.eyes, s0 = Math.max(OW / W, OH / H), lock = !!st.eyelock;
    const z = zoomAt(b, srcT) * (lock ? (st.lockZoom || 1.12) : 1);

  function autoY() {   // eyelock.py: pin the eyes where they naturally sit (median), kept inside the main area

  }
  window.takeAutoY = () => TK ? autoY() : 0.36;
  const NEED = new Map();
  function lockNeed(b, px, py, W, H) {
    const key = b.in + '|' + b.out + '|' + px + '|' + py + '|' + OW + '|' + OH; if (NEED.has(key)) return NEED.get(key);

  window.GEFX_CLIPS = () => TK ? TK.blocks.map((b, i) => ({ id: b.id, t0: starts[i], t1: starts[i] + dur(b) })) : [];

  /* ---------- timeline: blocks one after another ---------- */
  function layout() {
    starts = []; let acc = 0; TK.blocks.forEach(b => { starts.push(acc); acc += dur(b); });

    const tw = [];

    let g = null;

      const brk = !g || g.words.length >= max || (w.t - prev.e) > 10 / FPS || /[.?!]$/.test(prev.w) || (look === 'sky' && txt.length > 16);

    });

    const ED = TK.capEdits || {};

        const a = g.words[0].t, z = g.words[g.words.length - 1].e, nw = txt.split(/\s+/), d = Math.max(0.05, (z - a) / nw.length);

    const s = capState(T);
    if (!s) { CAPS.innerHTML = ''; drawnG = -1; return; }
    const g = groups[s.gi], c = Object.assign({}, TK.settings.caption, g.ov), k = Math.min(OW, OH) / 1080, wide = OW > OH;
    if (drawnG !== s.gi || drawnLook !== JSON.stringify(c) + PICK) {

      box.onpointerdown = e => { e.stopPropagation(); try { parent.takeCapPick && parent.takeCapPick(g.key); } catch (er) {} }; const bw = (wide ? 0.7 : 880 / 1080) * OW;
      box.style.left = (OW - bw) / 2 + 'px'; box.style.width = bw + 'px'; box.style.top = (c.y ?? (wide ? 0.8 : 0.703)) * OH + 'px';

          if (st) { e.style.font = `700 ${80 * k * sz}px/.8 Caveat,cursive`; e.style.color = c.stress || '#f3e6cf'; const u = document.createElement('b'); u.style.background = '#a3150a'; e.textContent = word; e.append(u); box.append(e); return; }
        } else if (look === 'sky') {

          else e.style.cssText = `font:700 ${97 * k * sz}px/1 ${c.font ? `'${c.font}',` : ''}Inter,sans-serif;letter-spacing:-0.02em;color:${c.color || '#F4F7FD'};text-shadow:0 3px 10px rgba(0,0,0,.55);margin:0 ${10 * k}px`;
        } else {   // GauthamWho Word build (CAPTION-LIBRARY Style 2) in his brand colours

        }

    box.style.opacity = s.fade;

  /* ---------- safe-zone layer (IG_REELS from Common/motion/safezone.tsx; never in the video file) ---------- */

  /* ---------- size ---------- */

    V.style.width = TK.info.w + 'px'; V.style.height = TK.info.h + 'px';

  /* ---------- draw one moment ---------- */

  /* ---------- Hide background (chat 9, L534): his cut-out mask turns the background see-through ---------- */
  const CV = $('#cv'), MV = $('#mv'), PIC = $('#pic'); let bgOn = false, cx = null, mx = null, mc = null, CO = { v: 0 };

    }
    wantPlay = false; if (!V.paused) V.pause();
    return seekV(f.srcT);
  };
  let PLAY = false, forcedMute = false;   // the editor says when it plays (take_ui.js wraps play()); the guess above stays for other callers
  window.takePlaying = on => { PLAY = !!on; if (!on) { wantPlay = false; V.pause(); } };
  setInterval(() => { if (!PLAY && wantPlay && performance.now() - lastWall > 300) { wantPlay = false; V.pause(); } }, 150);   // editor stopped

  /* ---------- live changes from the editor (blocks, eye-lock, captions, safe zone) ---------- */
  window.takeSet = function (tk) {
    const aspectChanged = !TK || tk.settings.aspect !== TK.settings.aspect;
    TK = JSON.parse(JSON.stringify(tk)); layout(); if (aspectChanged) setSize(); drawSafe(); drawnG = -1;
    if (window.GEFX) window.GEFX.set(TK.fx || null);
    window.at(Math.max(0, lastT) * 1000);
  };
  (async function boot() {
    try {
      const r = await fetch('/api/take/info', { cache: 'no-store' }); TK = await r.json();
      if (!TK || !TK.blocks) { $('#msg').textContent = 'This take is still being prepared…'; setTimeout(boot, 3000); return; }
      setSize(); layout(); drawSafe(); $('#msg').remove(); if (window.GEFX) window.GEFX.set(TK.fx || null);
      if (!CAP) { V.src = TK.proxy + '?v=' + (TK.auto && TK.auto.made || ''); await new Promise(res => { V.onloadeddata = res; setTimeout(res, 8000); }); await loadMask(); }
      else V.remove();
      // every caption font loaded up front: a font first used mid-video would be invisible for a moment (font-display block)
      await Promise.all(['900 40px Inter', '700 40px Inter', '800 40px "Inter Tight"', '40px "DM Serif Display"', '700 40px Caveat', 'italic 40px "Instrument Serif"',
        '40px Anton', '900 40px Montserrat', '800 40px Poppins', '40px "Bebas Neue"'].map(f => document.fonts.load(f).catch(() => null)));
      await document.fonts.ready; window.CAPREADY = true;
      const t0 = +(Q.get('at') || 0); window.at(t0 * 1000);
    } catch (e) { $('#msg').textContent = 'Could not open the take: ' + e; }
  })();
})();
</script></body></html>
