<!doctype html><html><head><meta charset="utf-8"><title>Demo reel (template for a new kit)</title>
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#223}
.card{position:absolute;width:300px;height:200px;border-radius:14px;font:700 40px sans-serif;color:#fff;display:flex;align-items:center;justify-content:center}</style></head><body>
<div class="card" data-edit style="left:100px;top:300px;background:#c4251a">One</div>
<div class="card" data-edit style="left:600px;top:700px;background:#2a7de1">Two</div>
<script>
/* the whole contract a kit has to meet: window.at(ms) freezes a frame, window.TOTAL = seconds */
window.TOTAL = 6;
window.at = ms => { document.querySelectorAll('.card').forEach((c, i) => c.style.transform = `translateY(${Math.sin(ms / 1000 + i) * 40}px)`); };
window.at(0);
</script></body></html>
